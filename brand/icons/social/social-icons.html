<a class="kd-si" href="https://www.facebook.com/..." aria-label="Facebook">
  <svg viewBox="0 0 24 24" aria-hidden="true">
    <use href="#kd-si-frame"/>
    <use href="#kd-si-facebook" x="6" y="6" width="12" height="12"/>
  </svg>
</a>
